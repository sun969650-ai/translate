<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 智能翻译 · 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">
    <header class="page-head">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h8" /><path d="M14 5h6" /><path d="M9 3v2" />
            <path d="M4 12h6" /><path d="M12 12h8" /><path d="M4 19h8" /><path d="M14 19h6" />
            <path d="M20 3v18" />
          </svg>
        </span>
        <div>
          <h1>AI 智能翻译 · 高级设置</h1>
          <p>兼容 OpenAI Chat Completions 协议，可填入任意兼容服务的 BaseUrl、API Key 与模型名。</p>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>接口配置</h2>
        <label class="field">
          <span>BaseUrl</span>
          <input id="baseUrl" type="text" placeholder="https://api.deepseek.com" spellcheck="false" />
          <em>示例：https://api.deepseek.com、https://api.openai.com/v1、http://localhost:11434/v1</em>
        </label>
        <label class="field">
          <span>API Key</span>
          <div class="secret">
            <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false" />
            <button id="toggleKey" class="eye" type="button">👁</button>
          </div>
        </label>
        <label class="field">
          <span>模型名称</span>
          <input id="model" type="text" placeholder="deepseek-chat" spellcheck="false" />
        </label>
        <div class="row">
          <label class="field">
            <span>温度（temperature）</span>
            <input id="temperature" type="number" step="0.1" min="0" max="2" />
          </label>
          <label class="field">
            <span>最大输出 Tokens</span>
            <input id="maxTokens" type="number" step="256" min="256" max="32768" />
          </label>
        </div>
        <div class="btn-row">
          <button id="testBtn" class="ghost-btn">测试连接</button>
          <button id="saveBtn" class="primary-btn">保存设置</button>
        </div>
        <div id="message" class="message hidden"></div>
      </section>

      <section class="card">
        <h2>翻译偏好</h2>
        <div class="row">
          <label class="field">
            <span>目标语言</span>
            <select id="targetLang"></select>
          </label>
          <label class="field">
            <span>原文语言</span>
            <select id="sourceLang"></select>
          </label>
        </div>
        <label class="field">
          <span>总结风格</span>
          <select id="summaryStyle">
            <option value="brief">简要（概要 + 核心要点）</option>
            <option value="detailed">详细（概要 + 要点 + 细节 + 提示）</option>
          </select>
        </label>
        <label class="switch">
          <input id="floatButton" type="checkbox" />
          <span>划词后显示悬浮「翻译」按钮</span>
        </label>
        <label class="switch">
          <input id="autoTranslate" type="checkbox" />
          <span>打开网页时自动翻译整页（谨慎开启）</span>
        </label>
      </section>

      <section class="card">
        <h2>快捷键</h2>
        <ul class="keys">
          <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd><span>翻译当前页面</span></li>
          <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd><span>恢复页面原文</span></li>
          <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd><span>翻译选中文本</span></li>
          <li><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd><span>总结当前页面</span></li>
        </ul>
        <p class="tip">可在 <code>chrome://extensions/shortcuts</code> 中自定义快捷键。</p>
      </section>

      <section class="card">
        <h2>维护</h2>
        <div class="btn-row">
          <button id="clearCache" class="ghost-btn">清空翻译缓存</button>
          <button id="resetBtn" class="ghost-btn">恢复默认设置</button>
        </div>
        <p class="tip">配置保存在浏览器本地（chrome.storage.local），不会上传到任何第三方服务器，只会用于请求你填写的接口。</p>
      </section>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
